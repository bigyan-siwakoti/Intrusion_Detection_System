<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="DejaVu Sans, Arial, sans-serif">
<title>Agent tools</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5b6774"/></marker></defs>
<rect width="1100" height="640" fill="white"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#1d2733">The agent&#8217;s toolkit: what DeepSeek can do, and only that</text>
<text x="40" y="70" font-size="13" fill="#5b6774">The model only proposes a tool call (JSON); the engine checks it and runs it. 13 tools, selected per experiment profile.</text>
