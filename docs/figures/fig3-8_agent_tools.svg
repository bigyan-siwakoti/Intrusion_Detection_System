<text x="550.0" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2733">DeepSeek V4 Pro / Claude</text>
<text x="550.0" y="143" text-anchor="middle" font-size="11" fill="#5b6774">proposes the next tool call</text>
<rect x="400" y="205" width="300" height="84" rx="10" fill="#eef4fa" stroke="#1f4e79" stroke-width="2"/>
<text x="550.0" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2733">Triage engine (src/engine.py)</text>
<text x="550.0" y="253" text-anchor="middle" font-size="11" fill="#5b6774">validates paths, applies the profile,</text>
<text x="550.0" y="270" text-anchor="middle" font-size="11" fill="#5b6774">runs the tool, returns the result</text>
