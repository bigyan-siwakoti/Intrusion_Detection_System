<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="DejaVu Sans, Arial, sans-serif">
<title>test_rule gate</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5b6774"/></marker></defs>
<rect width="1100" height="470" fill="white"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#1d2733">test_rule: is the rule detecting behaviour, or just the source address?</text>
<text x="40" y="70" font-size="13" fill="#5b6774">Two replays of capture 3 (~20 s): the rule as written, and the same rule widened to any any -&gt; any any. Internal-to-internal traffic is known-good.</text>
<rect x="40" y="100" width="1020" height="160" rx="12" fill="#f4f6f8" stroke="#b03a2e" stroke-width="2"/>
<text x="64" y="132" font-size="14" font-weight="700" fill="#1d2733">Topology example</text>
<text x="64" y="156" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1d2733">smtp $EXTERNAL_NET -&gt; $HOME_NET content:"MAIL FROM"</text>
<text x="64" y="195" font-size="12" fill="#5b6774">as written</text>
<rect x="170" y="180" width="52.62357414448669" height="20" fill="#9aa3ad"/>
<rect x="222.6235741444867" y="180" width="0.0" height="20" fill="#b03a2e"/>
<text x="232.6235741444867" y="195" font-size="12" fill="#1d2733">173 external→internal · 0 internal→internal</text>
<text x="64" y="227" font-size="12" fill="#5b6774">widened</text>
<rect x="170" y="212" width="52.62357414448669" height="20" fill="#9aa3ad"/>
<rect x="222.6235741444867" y="212" width="507.37642585551333" height="20" fill="#b03a2e"/>
<text x="740.0" y="227" font-size="12" fill="#1d2733">173 external→internal · 1,668 internal→internal</text>
<rect x="900" y="120" width="130" height="44" rx="8" fill="#b03a2e"/>
<text x="965" y="149" text-anchor="middle" font-size="18" font-weight="700" fill="white">FAIL</text>
<rect x="40" y="280" width="1020" height="160" rx="12" fill="#f4f6f8" stroke="#2e7d4f" stroke-width="2"/>
<text x="64" y="312" font-size="14" font-weight="700" fill="#1d2733">Behavioural example</text>
<text x="64" y="336" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1d2733">http $EXTERNAL_NET -&gt; $HOME_NET http.uri content:"../"</text>
<text x="64" y="375" font-size="12" fill="#5b6774">as written</text>
<rect x="170" y="360" width="560.0" height="20" fill="#9aa3ad"/>
<rect x="730.0" y="360" width="0.0" height="20" fill="#b03a2e"/>
<text x="740.0" y="375" font-size="12" fill="#1d2733">10 external→internal · 0 internal→internal</text>
<text x="64" y="407" font-size="12" fill="#5b6774">widened</text>
<rect x="170" y="392" width="560.0" height="20" fill="#9aa3ad"/>
<rect x="730.0" y="392" width="0.0" height="20" fill="#b03a2e"/>
<text x="740.0" y="407" font-size="12" fill="#1d2733">10 external→internal · 0 internal→internal</text>
<rect x="900" y="300" width="130" height="44" rx="8" fill="#2e7d4f"/>
<text x="965" y="329" text-anchor="middle" font-size="18" font-weight="700" fill="white">PASS</text>
</svg>